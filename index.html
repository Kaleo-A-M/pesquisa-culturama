<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/culturama-favico.png" type="image/x-icon">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="logo Culturama">
            <h1>Pesquisa Online</h1>
        </header>
        <section>
            <form action="" method="get">

                <!-- Dados Pessoais -->
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <label for="name">Nome</label>
                    <input id="name" type="text" name="userName" placeholder="Digite seu nome" required>
                    <br>
                    <label for="age">Idade</label>
                    <input id="age" type="number" name="userAge" min="12" max="100" placeholder="Digite sua idade"
                        required>
                    <br>
                    <label for="birthDate">Data de nasciemnto</label>
                    <input id="birthDate" type="date" name="userBirthDate">
                    <br>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="userEmail" placeholder="Digite seu email" required>
                    <br>
                    <label for="phoneNumber">Telefone</label>
                    <input id="phoneNumber" type="tel" name="userPhonerNumber" pattern="[0-9]{11}"
                        placeholder="DDD + numero sem espaços ou ifem">
                    <br>
                    <label for="image">Uploud de Foto</label>
                    <input id="image" type="file" accept="image/*" name="userImage">
                    <br>
                </fieldset>

                <!-- Dados de Perfil -->
                <fieldset>
                    <legend>Perfil</legend>
                    <p>Gênero:</p>
                    <input id="fem" type="radio" name="userGender" value="Feminino">
                    <label for="fem">Feminino</label>
                    <input id="masc" type="radio" name="userGender" value="Masculino">
                    <label for="masc">Masculino</label>
                    <input id="notInformed" type="radio" name="userGender" value="notInformed">
                    <label for="notInformed">Prefiro não informar</label>
                    <br>
                    <label for="maritalStatus">Estado cívil: </label>
                    <select id="maritalStatus" name="userMaritalStatus">
                        <option value="notIformed">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="casado">União estável</option>
                    </select>


                    <label for="state">Estado:</label>
                    <select id="state" name="userState">
                        <option value="notInformed">Selecione...</option>
                        <option value="Acre"> Acre </option>
                        <option value="Alagoas"> Alagoas </option>
                        <option value="Amapa"> Amapá </option>
                        <option value="Amazonas"> Amazonas </option>
                        <option value="Bahia"> Bahia </option>
                        <option value="Ceará"> Ceará </option>
                        <option value="Distrito-Federal"> Distrito Federal </option>
                        <option value="Espirito-Santo"> Espirito Santo </option>
                        <option value="Goias"> Goiás </option>
                        <option value="Maranhao"> Maranhão </option>
                        <option value="Mato-Grosso-do-Sul"> Mato Grosso do Sul </option>
                        <option value="Mato-Grosso"> Mato Grosso </option>
                        <option value="Minas-Gerais"> Minas Gerais </option>
                        <option value="Para"> Pará </option>
                        <option value="Paraiba"> Paraíba </option>
                        <option value="Parana"> Paraná </option>
                        <option value="Pernambuco"> Pernambuco </option>
                        <option value="Piaui"> Piauí </option>
                        <option value="Rio-de-Janeiro"> Rio de Janeiro </option>
                        <option value="Rio-Grande-do-Norte"> Rio Grande do Norte </option>
                        <option value="Rio-Grande-do-Sul"> Rio Grande do Sul </option>
                        <option value="Rondonia"> Rondônia </option>
                        <option value="Roraima"> Roraima </option>
                        <option value="Santa-Catarina"> Santa Catarina </option>
                        <option value="São-Paulo"> São Paulo </option>
                        <option value="Sergipe"> Sergipe </option>
                        <option value="Tocantins"> Tocantins </option>
                    </select>
                    <br>

                    <label for="city">Cidade:</label>
                    <input id="city" type="text" name="userCity" placeholder="Digite a sua cidade" required>
                </fieldset>

                <!-- Dados de Hábitos -->
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais:</p>
                    <input id="instagram" type="checkbox" name="social" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input id="facebook" type="checkbox" name="social" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input id="linkedin" type="checkbox" name="social" value="linkedin">
                    <label for="linkedin">Linkedin</label>
                    <br>
                    <input id="X" type="checkbox" name="social" value="X">
                    <label for="X">X</label>
                    <br>
                    <label for="musicStyle">Estilo musical:</label>
                    <input list="styleTypes" type="text" name="userMusicStyle" id="musicStyle"
                        placeholder="Digite seu estilo musical">
                    <datalist id="styleTypes">
                        <option value="Rock">
                        <option value="Sertanejo">
                        <option value="Samba">
                        <option value="Pop">
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor favorita</label>
                    <input type="color" name="useFavoriteColor" id="favoriteColor">
                    <br>
                </fieldset>

                <!-- Dados de Opnião -->
                <fieldset>
                    <legend>Opnião</legend>
                    <label for="scaleSatisfaction">Escala de Satifação:</label>
                    <br>
                    <input type="radio" name="userOpnion" id="otimo" value="otimo">
                    <label for="otimo">Ótimo</label>
                    <br>
                    <input type="radio" name="userOpnion" id="boa" value="boa">
                    <label for="boa">Boa</label>
                    <br>
                    <input type="radio" name="userOpnion" id="regular" value="regular">
                    <label for="regular">Regular</label>
                    <br>
                    <input type="radio" name="userOpnion" id="ruim" value="ruim">
                    <label for="ruim">Ruim</label>
                    <br>
                    <label for="comment">Escreva sua opnião:</label>
                    <br>
                    <textarea name="userComment" id="comment" rows="4" cols="50"
                        placeholder="Digite aqui..."></textarea>
                </fieldset>

                <!-- Dados de Confirmação -->
                <fieldset>
                    <legend>Confirmações</legend>
                    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa.</label>
                    <br>
                    <input type="checkbox" name="userGetResult" id="getResult" value="accepted" required>
                    <label for="getResult">Desejo receber o resultado por email.</label>
                </fieldset>

                <!-- Botões -->
                <button type="submit">
                    Enviar
                </button>

                <button type="reset">
                    Limpar
                </button>

            </form>
        </section>
    </main>
    <footer></footer>
</body>

</html>
