<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>


        <form action="" method="get">

            <fieldset>
                <!-- DADOS PESSOAIS -->

                <legend>Dados Pessoais</legend>
                <label for="userName">Nome</label>
                <input type="text" name="userName" required>
                <br>
                <label for="userAge">Idade</label>
                <input type="number" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de nasciemnto</label>
                <input type="date" name="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
                <br>
                <label for="userPhonerNumber">Telefone</label>
                <input type="tel" name="userPhonerNumber" pattern="[0-9]{11}"
                    placeholder="DDD + numero sem espaços ou ifem">
                <br>
                <label for="userImage">Uploud de Foto</label>
                <input type="file" accept="image/*" name="userImage">
                <br>
            </fieldset>

            <button type="submit">
                Enviar
            </button>

        </form>
    </section>
    <footer></footer>
</body>

</html>
